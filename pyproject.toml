[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-datris"
version = "0.1.3"
description = "Apache Airflow provider for Datris — trigger and monitor Datris taps from DAGs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Datris", email = "support@datris.ai" }]
keywords = ["airflow", "datris", "provider", "etl", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "apache-airflow>=3.0.0",
    "requests>=2.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://datris.ai"
Documentation = "https://docs.datris.ai/integrations/airflow"
Source = "https://github.com/datris/airflow-provider-datris"

# Airflow discovers the provider through this entry point.
[project.entry-points.apache_airflow_provider]
provider_info = "datris_provider.__init__:get_provider_info"

[tool.hatch.build.targets.wheel]
packages = ["src/datris_provider"]
